engine:
  name: default_engine
  state: UltraGaussOfflineState
  task: train
  stream: offline
  iterations: 30000
  accum_steps: 1
  resume: ''
  needed_callbacks:
  - UltraGaussOfflineSetupCallback
  - UltraGaussOfflineTrainCallback
  - UltraGaussOfflineTestCallback
  - UltraGaussOfflineSaveCallback
  - UltraGaussOfflineFinishCallback
  interval:
    train:
      step: 10
      print: 100
    debug: 1000
    test: 5000
    save: 5000
scene:
  dataset_name: synthetic_liver
  loading:
    baseroot: /home/boywang25/ultrasound-scene-reconstruction/data
    sweep_name: l1
    images_name: images.npy
    pose_type: absolute
    test_mode: holdout_interval
    holdout_trim_each: 10
    holdout_num_samples: 0
    holdout_test_ratio: 0.2
    test_images_name: test_images.npy
    test_poses_name: test_poses.npy
    image_value_mode: uint8_255
    image_nan_value: 0.0
    image_downsample_factor: 1
    axial_downsample_factor: 1
    frame_start: 0
    frame_end: -1
    frame_stride: 1
    pose_mode: file
    canonical_sweep_delta_mm: -1.0
    canonical_sweep_delta_scale: 1.0
    canonical_sweep_ref_frame: 0
    canonical_sweep_axis: z
    canonical_sweep_spacing_mode: uniform
  sampler:
    num_init: 1000000
    num_new: 5000
    scales_init:
    - 0.3
    - 0.3
    - 0.3
    quats_init:
    - 1.0
    - 0.0
    - 0.0
    - 0.0
    uniform_ratio: 0.3
    intensity_threshold: 0.05
    jitter_radius: 0.2
  scheduler:
    test_ratio: 0.1
  grid:
    tile_size: 4.0
    bbox_margin: 0.05
model:
  name: ultragauss
  render:
    chi2_threshold: 7.815
    mapper_sort_by_depth: false
    fixed_bg_alpha: 1.0e-06
    fixed_bg_intensity: 0.0
    diag_beta: 0.0001
    jitter_radius_ratio: 0.25
    enable_shadow: false
    shadow_delta: 0.0
  gauss_container:
    lr:
      means: 0.00016
      precision_tril: 0.035
      opacities: 0.05
      intensities: 0.05
    init_val:
      opacity: 0.731
      intensity: 0.5
      diag_raw_min: 4.0
      diag_raw_max: 5.0
      offdiag_std: 0.01
  offline:
    density_control:
      enable:
        densify: true
        prune: true
      timing:
        start_iter: 1000
        end_iter: 25000
        freq: 2000
      thresholds:
        densify_grad: 1.0e-05
        split_scale_mm: 0.6
        min_scale_mm: 5.0e-05
        max_scale_mm: 5.0
        prune_opacity: 0.01
        prune_intensity: 0.01
      n_max: 2000000
    diagnostics:
      enable_render_stats: true
      train_step: 100
loss:
  needed_losses:
  - l1
  - ssim
  - scale_wall
  lambdas:
    l1: 0.5
    ssim: 0.5
    sobel: 0.0
    highpass_l1: 0.0
    marco_ssim: 0.0
    lpips: 0.0
    diff_tv: 0.0
    scale_wall: 50.0
    scale_aniso: 0.0
    opacity: 0.0
    attenuation_l1: 0.0
    attenuation_tail: 0.0
    pose_anchor: 0.0
    pose_prior: 0.0
    pose_smooth: 0.0
    pose_acc: 0.0
    pose_aux_rec: 0.0
    pose_registration: 0.0
    pose_neighbor_registration: 0.0
    pose_cycle: 0.0
    pose_const_vel: 0.0
    pose_gt_delta: 0.0
    pose_occ_conf: 0.0
  ssim_cfg:
    window_size: 11
    sigma: 1.5
    downsample_enabled: false
    downsample_factor: 1
    downsample_mode: area
  highpass_l1_cfg:
    kernel_size: 9
    sigma: 2.0
  marco_ssim_cfg:
    blur_window_size: 21
    blur_sigma: 3.0
    ssim_window_size: 11
    ssim_sigma: 1.5
  lpips_cfg:
    metric_name: lpips
  scale_wall_cfg:
    min_scales_mm: 0.001
    max_scales_mm: 1.2
  scale_aniso_cfg:
    max_aniso_ratio: 2.5
  opacity_cfg:
    target_opacity: 0.5
  attenuation_tail_cfg:
    max_attenuation: 0.05
  pose_anchor_cfg:
    rot_weight: 1.0
    trans_weight: 1.0
  pose_prior_cfg:
    rot_weight: 1.0
    trans_weight: 1.0
  pose_smooth_cfg:
    rot_weight: 1.0
    trans_weight: 1.0
  pose_acc_cfg:
    rot_weight: 1.0
    trans_weight: 1.0
  pose_aux_rec_cfg:
    l1_weight: 0.8
    ssim_weight: 0.2
    window_size: 11
    sigma: 1.5
  pose_registration_cfg:
    photo_weight: 1.0
    grad_weight: 0.2
    charbonnier_eps: 0.001
  pose_neighbor_registration_cfg:
    photo_weight: 1.0
    ssim_weight: 0.2
    charbonnier_eps: 0.001
    window_size: 11
    sigma: 1.5
    min_overlap_ratio: 0.3
  pose_cycle_cfg:
    photo_weight: 1.0
    ssim_weight: 0.1
    charbonnier_eps: 0.001
    window_size: 11
    sigma: 1.5
    min_overlap_ratio: 0.3
  pose_const_vel_cfg:
    rot_weight: 1.0
    trans_weight: 1.0
  pose_gt_delta_cfg:
    rot_weight: 1.0
    trans_weight: 1.0
  pose_occ_conf_cfg:
    charbonnier_epsilon: 0.001
    confidence_gamma: 1.0
    confidence_min: 0.05
    detach_confidence: true
metric:
  needed_metrics:
  - psnr
  - l1
  - ssim
  - lpips
  - dists
  - gmsd
  max_vis_frames: 10
  save_per_frame_metrics: true
  psnr_cfg:
    max_val: 1.0
system:
  output_root: /home/boywang25/ultrasound-scene-reconstruction/omniultra/outputs/production/comparisons/us_recon_four_dataset_p100k_v1
  output_dir: ''
  exp_tag: stage1_calibration_synthetic_liver_l1_ultragauss
  run_id: ''
  run_name: ''
  config_path: ''
  hydra_output_dir: ''
  use_legacy_output_naming: false
  device: cuda
  seed: 42
wandb:
  enable: false
  project: omniultra
  entity: ''
  mode: online
  group: ''
  name: ''
  tags: []
  log_artifacts: false
experiment:
  family: production/comparisons/us_recon_four_dataset_p100k_v1/gs_strict
  name: ultragauss
  description: UltraGauss GS-strict alias; method-native renderer and thresholds with
    1M init, 30k iterations, best PSNR checkpoint, shared DC timing.
  protocol: gs_strict_1m30k_dc_t1000_25000_f2000
task: train
