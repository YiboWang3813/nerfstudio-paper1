# @package _global_

defaults:
- /engine: debug_offline
- /scene: spine_phantom
- /model: ours_us_focus
- /loss: default
- /metric: default
- /system: default
- _self_

system:
  exp_tag: ours_us_focus_spine_phantom_preflight_10k

scene:
  loading:
    sweep_name: left1
    test_mode: holdout_interval
    holdout_trim_each: 10
    holdout_num_samples: 40
    image_downsample_factor: 1
    axial_downsample_factor: 1
  sampler:
    num_init: 1000000
    num_new: 1000

engine:
  state: OursOfflineState
  iterations: 10000
  needed_callbacks:
  - OursOfflineSetupCallback
  - OursOfflineTrainCallback
  - OursOfflineTestCallback
  - OursOfflineSaveCallback
  - OursOfflineFinishCallback
  interval:
    train:
      step: 10
      print: 100
    test: 2500
    save: 5000

model:
  gauss_init:
    num_points: 1000000
  slice_render:
    elev_corridor_half_mm: 0.395
    slab_half_thickness_mm: 0.0
  offline:
    density_control:
      timing:
        start_iter: 1000
        end_iter: 8000
        freq: 1000

loss:
  needed_losses:
  - l1
  - ssim
  - scale_wall
  lambdas:
    l1: 0.65
    ssim: 0.35
    scale_wall: 50.0

experiment:
  family: preproduction/dataset_preflight/spine_phantom
  name: spine_phantom_preflight_10k
  description: Spine phantom production-preflight 10k ours_us_focus protocol on the p100k export with comparison-style holdout metrics.
