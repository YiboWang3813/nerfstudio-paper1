# @package _global_

model:
  name: ultrags_baseline
  render:
    sh_degree: 2
    active_sh_degree_start: 0
    sh_degree_step_iter: 1000
    camera_mode: released_pose_fov
    physical_camera_distance_mm: 200.0
    dar_mode: released_disabled
    fov_x_deg: 60.0
    fov_y_deg: 60.0
    fov_x_min_deg: 20.0
    fov_x_max_deg: 140.0
    fov_y_min_deg: 20.0
    fov_y_max_deg: 140.0
    znear: 0.01
    zfar: 1000.0
    bg_color: 0.0
    scale_modifier: 1.0
    enable_slice_cull: true
    slice_thickness_ratio: 0.5
    slice_thickness_mm: null
    slice_cull_std: 3.0
    slice_cull_scale_multiplier: 3.0
    opacity_slice_attenuation: true
    debug: false
    output_grayscale: true
  gauss_container:
    lr:
      means: 0.00016
      sh_dc: 0.0025
      sh_rest: 0.000125
      opacities: 0.05
      scales_2d: 0.005
      quats: 0.001
      fov_x: 0.001
      fov_y: 0.001
    init_val:
      opacity: 0.1
      scale_2d:
      - 0.3
      - 0.3
      sh_dc: 0.0
      fov_x: 0.0
      fov_y: 0.0
    scheduler:
      position_lr_final_scale: 0.01
      default_lr_final_scale: 0.1
      position_lr_delay_mult: 0.01
    constraints:
      opacity_max: 0.0
  offline:
    density_control:
      enable:
        densify: true
        prune: true
        opacity_reset: true
      timing:
        start_iter: 500
        end_iter: 30000
        freq: 0
        densification_interval: 100
        opacity_reset_interval: 3000
      thresholds:
        densify_grad: 0.0002
        opacity_cull: 0.05
        percent_dense: 0.01
        n_max: 300000
        min_scale_2d: 0.0
        max_scale_2d: 0.0
    diagnostics:
      enable_render_stats: true
      train_step: 100
