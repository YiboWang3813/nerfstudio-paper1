# @package _global_

defaults:
- /engine: debug_offline
- /scene: spine_phantom
- /model: ours_us_focus
- /loss: default
- /metric: default
- /system: default
- _self_

system:
  exp_tag: ours_us_focus_spine_phantom_left1_p100k_minimal

scene:
  loading:
    sweep_name: left1
    test_mode: holdout_interval
    holdout_trim_each: 8
    holdout_num_samples: 30
    image_downsample_factor: 1
    axial_downsample_factor: 1
  sampler:
    num_init: 300000
    num_new: 1000

engine:
  state: OursOfflineState
  iterations: 2000
  needed_callbacks:
  - OursOfflineSetupCallback
  - OursOfflineTrainCallback
  - OursOfflineTestCallback
  - OursOfflineSaveCallback
  - OursOfflineFinishCallback
  interval:
    train:
      step: 10
      print: 100
    test: 1000
    save: 2000

model:
  gauss_init:
    num_points: 300000
  slice_render:
    elev_corridor_half_mm: 0.395
    slab_half_thickness_mm: 0.0
  offline:
    density_control:
      timing:
        start_iter: 500
        end_iter: 1500
        freq: 500

loss:
  needed_losses:
  - l1
  - ssim
  - scale_wall
  lambdas:
    l1: 0.65
    ssim: 0.35
    scale_wall: 50.0

metric:
  needed_metrics:
  - psnr
  - l1
  - ssim
  - lpips

experiment:
  family: preproduction/dataset_preflight/spine_phantom
  name: spine_phantom_minimal
  description: Minimal production-path ours_us_focus validation on the p100k Ultra-NeRF spine_phantom left1 export with holdout eval.
