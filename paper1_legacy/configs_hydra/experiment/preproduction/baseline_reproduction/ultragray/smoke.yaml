# @package _global_

defaults:
- /engine: debug_offline
- /scene: liver
- /model: ultragray
- /loss: default
- /metric: default
- /system: default
- _self_
system:
  exp_tag: ultragray_smoke_10k_200
scene:
  loading:
    test_mode: holdout_interval
  sampler:
    num_init: 10000
    scales_init:
    - 0.5
    - 0.5
    - 0.5
engine:
  state: UltraGrayOfflineState
  iterations: 200
  needed_callbacks:
  - UltraGrayOfflineSetupCallback
  - UltraGrayOfflineTrainCallback
  - UltraGrayOfflineTestCallback
  - UltraGrayOfflineSaveCallback
  - UltraGrayOfflineFinishCallback
  interval:
    train:
      step: 10
      print: 50
    test: 200
    save: 200
model:
  render:
    k_sigma: 3.0
    ops_max_offset_mm: 2.0
    ops_train_only: true
    quadrature_window_radius_mm: 2.0
  offline:
    density_control:
      timing:
        start_iter: 50
        end_iter: 150
        freq: 50
loss:
  needed_losses:
  - l1
  - ssim
  - scale_wall
  lambdas:
    l1: 0.5
    ssim: 0.5
    scale_wall: 0.001
  scale_wall_cfg:
    min_scales_mm: 5.0e-05
    max_scales_mm: 5.0
metric:
  needed_metrics:
  - psnr
  - l1
  - ssim
  - lpips
experiment:
  family: preproduction/baseline_reproduction/ultragray
  name: smoke
  description: UltraGray CPU-friendly smoke template.
