hydra:
  run:
    dir: ${system.output_root}/${now:%Y-%m-%d}/${now:%H-%M-%S}_${slug:${experiment.family}}-${slug:${experiment.name}}_${slug:${model.name}}_${short_run_id:}
  sweep:
    dir: ${system.output_root}/multirun/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: ${hydra.job.num}_${slug:${experiment.family}}-${slug:${experiment.name}}_${slug:${model.name}}_${short_run_id:}
  launcher:
    _target_: hydra._internal.core_plugins.basic_launcher.BasicLauncher
  sweeper:
    _target_: hydra._internal.core_plugins.basic_sweeper.BasicSweeper
    max_batch_size: null
    params: null
  help:
    app_name: ${hydra.job.name}
    header: '${hydra.help.app_name} is powered by Hydra.

      '
    footer: 'Powered by Hydra (https://hydra.cc)

      Use --hydra-help to view Hydra specific help

      '
    template: '${hydra.help.header}

      == Configuration groups ==

      Compose your configuration from those groups (group=option)


      $APP_CONFIG_GROUPS


      == Config ==

      Override anything in the config (foo.bar=value)


      $CONFIG


      ${hydra.help.footer}

      '
  hydra_help:
    template: 'Hydra (${hydra.runtime.version})

      See https://hydra.cc for more info.


      == Flags ==

      $FLAGS_HELP


      == Configuration groups ==

      Compose your configuration from those groups (For example, append hydra/job_logging=disabled
      to command line)


      $HYDRA_CONFIG_GROUPS


      Use ''--cfg hydra'' to Show the Hydra config.

      '
    hydra_help: ???
  hydra_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][HYDRA] %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
    root:
      level: INFO
      handlers:
      - console
    loggers:
      logging_example:
        level: DEBUG
    disable_existing_loggers: false
  job_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][%(name)s][%(levelname)s] - %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
      file:
        class: logging.FileHandler
        formatter: simple
        filename: ${hydra.runtime.output_dir}/${hydra.job.name}.log
    root:
      level: INFO
      handlers:
      - console
      - file
    disable_existing_loggers: false
  env: {}
  mode: RUN
  searchpath: []
  callbacks: {}
  output_subdir: .hydra
  overrides:
    hydra:
    - hydra.mode=RUN
    task:
    - task=dry_run
    - experiment=production/comparisons/us_recon_four_dataset_p100k_v1/gs_strict/ours
    - scene=tdsc_abus_2023
    - scene.loading.sweep_name=validation_100
    - engine.iterations=1
    - system.device=cpu
    - model.gauss_container.constraints.scale_activation=bounded_sigmoid
    - model.gauss_container.constraints.scale_min_mm=0.03
    - model.gauss_container.constraints.scale_max_mm=3.89
    - model.slice_render.ray_attenuation_enabled=false
    - model.slice_render.ray_attenuation_strength=0.0
    - model.slice_render.ray_attenuation_beta=0.0
  job:
    name: run
    chdir: false
    override_dirname: engine.iterations=1,experiment=production/comparisons/us_recon_four_dataset_p100k_v1/gs_strict/ours,model.gauss_container.constraints.scale_activation=bounded_sigmoid,model.gauss_container.constraints.scale_max_mm=3.89,model.gauss_container.constraints.scale_min_mm=0.03,model.slice_render.ray_attenuation_beta=0.0,model.slice_render.ray_attenuation_enabled=false,model.slice_render.ray_attenuation_strength=0.0,scene.loading.sweep_name=validation_100,scene=tdsc_abus_2023,system.device=cpu,task=dry_run
    id: ???
    num: ???
    config_name: config
    env_set: {}
    env_copy: []
    config:
      override_dirname:
        kv_sep: '='
        item_sep: ','
        exclude_keys: []
  runtime:
    version: 1.3.2
    version_base: '1.3'
    cwd: /home/boywang25/ultrasound-scene-reconstruction/omniultra
    config_sources:
    - path: hydra.conf
      schema: pkg
      provider: hydra
    - path: /home/boywang25/ultrasound-scene-reconstruction/omniultra/configs_hydra
      schema: file
      provider: main
    - path: ''
      schema: structured
      provider: schema
    output_dir: /home/boywang25/ultrasound-scene-reconstruction/omniultra/outputs/2026-06-25/20-38-49_production-comparisons-us_recon_four_dataset_p100k_v1-gs_strict-ours_ours_830f16a
    choices:
      experiment: production/comparisons/us_recon_four_dataset_p100k_v1/gs_strict/ours
      system: default
      metric: default
      loss: default
      model: ours_us_focus
      scene: tdsc_abus_2023
      engine: debug_offline
      hydra/env: default
      hydra/callbacks: null
      hydra/job_logging: default
      hydra/hydra_logging: default
      hydra/hydra_help: default
      hydra/help: default
      hydra/sweeper: basic
      hydra/launcher: basic
      hydra/output: default
  verbose: false
