# @package _global_

defaults:
- /experiment/preproduction/baseline_reproduction/ultragauss/main_10k
- _self_

system:
  exp_tag: gs_strict_ultragauss_1m30k_dc_t1000_25000_f2000

scene:
  loading:
    pose_type: absolute
    pose_mode: file
    holdout_num_samples: 0
    holdout_test_ratio: 0.2
  sampler:
    num_init: 1000000

engine:
  iterations: 30000
  interval:
    test: 30000
    save: 30000

model:
  gauss_container:
    lr:
      precision_tril: 0.004
  offline:
    density_control:
      enable:
        densify: true
        prune: true
      timing:
        start_iter: 1000
        end_iter: 25000
        freq: 2000
      n_max: 2000000

loss:
  needed_losses:
  - l1
  - ssim
  lambdas:
    l1: 0.8
    mse: 0.0
    ssim: 0.2
    sobel: 0.0
    highpass_l1: 0.0
    marco_ssim: 0.0
    lpips: 0.0
    diff_tv: 0.0
    scale_wall: 0.0
    scale_aniso: 0.0
    opacity: 0.0
    attenuation_l1: 0.0
    attenuation_tail: 0.0
    pose_anchor: 0.0
    pose_prior: 0.0
    pose_smooth: 0.0
    pose_acc: 0.0
    pose_aux_rec: 0.0
  l1_cfg:
    clamp_inputs: false
  ssim_cfg:
    clamp_inputs: false

metric:
  needed_metrics:
  - psnr
  - l1
  - ssim
  - lpips
  - dists
  - gmsd
  max_vis_frames: 10
  save_per_frame_metrics: true

experiment:
  family: production/comparisons/us_recon_four_dataset_p100k_v1/gs_strict
  name: ultragauss
  protocol: gs_strict_1m30k_dc_t1000_25000_f2000
  description: UltraGauss GS-strict alias; method-native renderer and thresholds with 1M init, 30k iterations, final 30k checkpoint, shared DC timing, calibrated precision LR, unified 0.8 L1 + 0.2 SSIM loss without scale-wall.
