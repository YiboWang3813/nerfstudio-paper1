# @package _global_

defaults:
- /experiment/preproduction/baseline_reproduction/gaussianpile/main_30k
- _self_

system:
  exp_tag: gs_strict_gaussianpile_1m30k_r075_dc_nmax2m_t1000_25000_f2000

scene:
  loading:
    pose_type: absolute
    pose_mode: file
    holdout_num_samples: 0
    holdout_test_ratio: 0.2
  sampler:
    num_init: 1000000

engine:
  iterations: 30000
  interval:
    test: 30000
    save: 30000

model:
  gauss_init:
    num_points: 1000000
  gauss_container:
    constraints:
      scale_activation: exp
  slice_render:
    sigma_z_mm: null
    sigma_z_ratio: 0.75
  offline:
    diagnostics:
      restore_best_on_finish: false
    density_control:
      enable:
        densify: true
        prune: true
      timing:
        start_iter: 1000
        end_iter: 25000
        freq: 2000
        grad_accum_interval: 1
      thresholds:
        prune_opacity: 0.002
        prune_observation_score: 0.25
        min_prune_observations: 4
      n_max: 2000000

loss:
  needed_losses:
  - l1
  - ssim
  lambdas:
    l1: 0.8
    mse: 0.0
    ssim: 0.2
    sobel: 0.0
    highpass_l1: 0.0
    marco_ssim: 0.0
    lpips: 0.0
    diff_tv: 0.0
    scale_wall: 0.0
    scale_aniso: 0.0
    opacity: 0.0
    attenuation_l1: 0.0
    attenuation_tail: 0.0
    pose_anchor: 0.0
    pose_prior: 0.0
    pose_smooth: 0.0
    pose_acc: 0.0
    pose_aux_rec: 0.0
  l1_cfg:
    clamp_inputs: false
  ssim_cfg:
    clamp_inputs: false

metric:
  needed_metrics:
  - psnr
  - l1
  - ssim
  - lpips
  - dists
  - gmsd
  max_vis_frames: 10
  save_per_frame_metrics: true

experiment:
  family: production/comparisons/us_recon_four_dataset_p100k_v1/gs_strict
  name: gaussianpile
  protocol: gs_strict_1m30k_dc_t1000_25000_f2000
  description: GaussianPile GS-strict production baseline; r075 elevational sigma from DatasetMeta delta_elevational_mm, spine-calibrated low-opacity pruning, 1M init, 30k iterations, n_max 2M, final 30k checkpoint, shared DC timing, unified 0.8 L1 + 0.2 SSIM loss.
