engine:
  name: default_engine
  state: UltraGrayOfflineState
  task: train
  stream: offline
  iterations: 30000
  accum_steps: 1
  resume: ''
  needed_callbacks:
  - UltraGrayOfflineSetupCallback
  - UltraGrayOfflineTrainCallback
  - UltraGrayOfflineTestCallback
  - UltraGrayOfflineSaveCallback
  - UltraGrayOfflineFinishCallback
  interval:
    train:
      step: 10
      print: 100
    debug: 1000
    test: 30000
    save: 30000
scene:
  dataset_name: tus_rec_2024
  loading:
    baseroot: /home/boywang25/ultrasound-scene-reconstruction/data
    dataset_dirname: tus_rec_2024_qc
    sweep_name: 011_LH_Per_C_PtD_qc_0006_0568
    images_name: images.npy
    pose_type: absolute
    test_mode: holdout_interval
    holdout_trim_each: 10
    holdout_num_samples: 0
    holdout_test_ratio: 0.2
    image_value_mode: uint8_255
    image_nan_value: 0.0
    image_downsample_factor: 1
    axial_downsample_factor: 1
    frame_start: 0
    frame_end: -1
    frame_stride: 1
    pose_mode: file
    canonical_sweep_delta_mm: -1.0
    canonical_sweep_delta_scale: 1.0
    canonical_sweep_ref_frame: 0
    canonical_sweep_axis: z
    canonical_sweep_spacing_mode: uniform
  sampler:
    num_init: 1000000
    num_new: 1000
    scales_init:
    - 0.5
    - 0.5
    - 0.5
    quats_init:
    - 1.0
    - 0.0
    - 0.0
    - 0.0
    uniform_ratio: 0.3
    intensity_threshold: 0.03
    jitter_radius: 0.2
  scheduler:
    test_ratio: 0.1
  grid:
    tile_size: 4.0
    bbox_margin: 0.05
model:
  name: ultragray
  render:
    k_sigma: 3.0
    elev_cutoff_margin_mm: 0.0
    ops_max_offset_mm: 2.0
    ops_train_only: true
    quadrature_window_radius_mm: 2.0
    local_transmission_window_only: true
    local_transmission_max_window_mm: 0.75
    elev_beam_width_mm: 2.0
  gauss_container:
    lr:
      means: 0.0001
      scales: 0.005
      quats: 0.005
      attenuations: 0.0005
      sh_dc: 0.005
      sh_rest: 1.0e-05
    init_val:
      tau: 0.99
      scale_mm: 0.5
      sh_dc: 0.1
  offline:
    sh_degree1_start_iter: 1000
    density_control:
      enable:
        densify: true
        prune: true
      timing:
        start_iter: 1000
        end_iter: 25000
        freq: 2000
      thresholds:
        densify_grad: 7.5e-06
        split_scale_mm: 0.5
        min_scale_mm: 5.0e-05
        max_scale_mm: 2.0
      n_max: null
loss:
  needed_losses:
  - l1
  - ssim
  lambdas:
    l1: 0.8
    ssim: 0.2
    sobel: 0.0
    highpass_l1: 0.0
    marco_ssim: 0.0
    lpips: 0.0
    diff_tv: 0.0
    scale_wall: 0.0
    scale_aniso: 0.0
    opacity: 0.0
    attenuation_l1: 0.0
    attenuation_tail: 0.0
    pose_anchor: 0.0
    pose_prior: 0.0
    pose_smooth: 0.0
    pose_acc: 0.0
    pose_aux_rec: 0.0
    pose_registration: 0.0
    pose_neighbor_registration: 0.0
    pose_cycle: 0.0
    pose_const_vel: 0.0
    pose_gt_delta: 0.0
    pose_occ_conf: 0.0
    mse: 0.0
  ssim_cfg:
    window_size: 11
    sigma: 1.5
    downsample_enabled: false
    downsample_factor: 1
    downsample_mode: area
    clamp_inputs: false
  l1_cfg:
    clamp_inputs: false
  highpass_l1_cfg:
    kernel_size: 9
    sigma: 2.0
  marco_ssim_cfg:
    blur_window_size: 21
    blur_sigma: 3.0
    ssim_window_size: 11
    ssim_sigma: 1.5
  lpips_cfg:
    metric_name: lpips
  scale_wall_cfg:
    min_scales_mm: 5.0e-05
    max_scales_mm: 5.0
  scale_aniso_cfg:
    max_aniso_ratio: 2.5
  opacity_cfg:
    target_opacity: 0.5
  attenuation_tail_cfg:
    max_attenuation: 0.05
  pose_anchor_cfg:
    rot_weight: 1.0
    trans_weight: 1.0
  pose_prior_cfg:
    rot_weight: 1.0
    trans_weight: 1.0
  pose_smooth_cfg:
    rot_weight: 1.0
    trans_weight: 1.0
  pose_acc_cfg:
    rot_weight: 1.0
    trans_weight: 1.0
  pose_aux_rec_cfg:
    l1_weight: 0.8
    ssim_weight: 0.2
    window_size: 11
    sigma: 1.5
  pose_registration_cfg:
    photo_weight: 1.0
    grad_weight: 0.2
    charbonnier_eps: 0.001
  pose_neighbor_registration_cfg:
    photo_weight: 1.0
    ssim_weight: 0.2
    charbonnier_eps: 0.001
    window_size: 11
    sigma: 1.5
    min_overlap_ratio: 0.3
  pose_cycle_cfg:
    photo_weight: 1.0
    ssim_weight: 0.1
    charbonnier_eps: 0.001
    window_size: 11
    sigma: 1.5
    min_overlap_ratio: 0.3
  pose_const_vel_cfg:
    rot_weight: 1.0
    trans_weight: 1.0
  pose_gt_delta_cfg:
    rot_weight: 1.0
    trans_weight: 1.0
  pose_occ_conf_cfg:
    charbonnier_epsilon: 0.001
    confidence_gamma: 1.0
    confidence_min: 0.05
    detach_confidence: true
metric:
  needed_metrics:
  - psnr
  - l1
  - ssim
  - lpips
  - dists
  - gmsd
  max_vis_frames: 10
  save_per_frame_metrics: true
  psnr_cfg:
