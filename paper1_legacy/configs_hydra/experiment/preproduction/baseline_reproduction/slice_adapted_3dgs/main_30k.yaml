# @package _global_

defaults:
- /engine: debug_offline
- /scene: liver
- /model: slice_adapted_3dgs
- /loss: default
- /metric: default
- /system: default
- _self_

system:
  exp_tag: slice_adapted_3dgs_liver_1m_30000_dc

scene:
  loading:
    sweep_name: l1
    pose_type: relative
    test_mode: holdout_interval
    holdout_trim_each: 10
    holdout_num_samples: 40
  sampler:
    num_init: 1000000
    uniform_ratio: 0.3
    intensity_threshold: 0.05
    jitter_radius: 0.2
    scales_init:
    - 0.3
    - 0.3
    - 0.3

engine:
  state: SliceAdapted3DGSOfflineState
  iterations: 30000
  needed_callbacks:
  - SliceAdapted3DGSOfflineSetupCallback
  - SliceAdapted3DGSOfflineTrainCallback
  - SliceAdapted3DGSOfflineTestCallback
  - SliceAdapted3DGSOfflineSaveCallback
  - SliceAdapted3DGSOfflineFinishCallback
  interval:
    train:
      step: 100
      print: 500
    test: 5000
    save: 10000

model:
  render:
    backend: cuda
    cull_std: 3.0
    slice_thickness_mm: 0.3
    thickness_scale: 1.0
    min_covariance: 0.0001
    normalize_by_footprint: true
    clamp_output: true
  offline:
    density_control:
      enable:
        densify: true
        prune: true
        opacity_reset: false
      timing:
        start_iter: 1000
        end_iter: 25000
        freq: 1000
        opacity_reset_interval: 3000
      thresholds:
        densify_grad: 1.0e-05
        split_scale_mm: 0.6
        min_scale_mm: 5.0e-05
        max_scale_mm: 5.0
        prune_opacity: 0.01
      n_max: 2000000

loss:
  needed_losses:
  - l1
  - ssim
  lambdas:
    l1: 0.8
    ssim: 0.2

metric:
  needed_metrics:
  - psnr
  - l1
  - ssim
  - lpips

experiment:
  family: preproduction/baseline_reproduction/slice_adapted_3dgs
  name: main_30k
  description: Slice-adapted original 3DGS baseline 1M/30k synthetic_liver density-control production-pre template.
