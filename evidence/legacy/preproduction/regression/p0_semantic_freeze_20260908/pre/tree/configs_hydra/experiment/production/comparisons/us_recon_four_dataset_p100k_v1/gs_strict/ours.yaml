# @package _global_

defaults:
- /experiment/preproduction/ideas/ours/responsibility_density_control/fixed_protocol_main_30k
- _self_

system:
  exp_tag: gs_strict_ours_1m30k_bounded_scale_dc_t1000_25000_f2000

scene:
  loading:
    pose_type: absolute
    pose_mode: file
    holdout_num_samples: 0
    holdout_test_ratio: 0.2
  sampler:
    num_init: 1000000

engine:
  iterations: 30000
  interval:
    test: 30000
    save: 30000

model:
  gauss_init:
    num_points: 1000000
  gauss_container:
    constraints:
      scale_activation: bounded_sigmoid
  slice_render:
    ray_attenuation_formula: integral
    ray_attenuation_quadrature_points: 3
    ray_attenuation_candidate_k_sigma: 2.0
    ray_attenuation_beta: 0.80
    ray_attenuation_strength: 0.55
    ray_attenuation_min_transmission: 0.35
  offline:
    density_control:
      strategy: contribution_residual
      timing:
        start_iter: 1000
        end_iter: 25000
        freq: 2000
      thresholds:
        prune_opacity: 0.0001
      responsibility:
        low_contribution_quantile: 0.10
        protect_attenuation_enabled: true
        protect_attenuation_mode: path_contribution
        path_contribution_threshold_mode: quantile
        path_contribution_quantile: 0.80

loss:
  needed_losses:
  - l1
  - ssim
  lambdas:
    l1: 0.8
    mse: 0.0
    ssim: 0.2
    sobel: 0.0
    highpass_l1: 0.0
    marco_ssim: 0.0
    lpips: 0.0
    diff_tv: 0.0
    scale_wall: 0.0
    scale_aniso: 0.0
    opacity: 0.0
    attenuation_l1: 0.0
    attenuation_tail: 0.0
    pose_anchor: 0.0
    pose_prior: 0.0
    pose_smooth: 0.0
    pose_acc: 0.0
    pose_aux_rec: 0.0
  l1_cfg:
    clamp_inputs: false
  ssim_cfg:
    clamp_inputs: false

metric:
  needed_metrics:
  - psnr
  - l1
  - ssim
  - lpips
  - dists
  - gmsd
  max_vis_frames: 10
  save_per_frame_metrics: true

experiment:
  family: production/comparisons/us_recon_four_dataset_p100k_v1/gs_strict
  name: ours
  protocol: gs_strict_1m30k_dc_t1000_25000_f2000
  description: Ours GS-strict production baseline; fixed renderer with validated integral attenuation parameters, bounded scale activation, 1M init, 30k iterations, final 30k checkpoint, shared DC timing, calibrated DC prune threshold, unified 0.8 L1 + 0.2 SSIM loss.
