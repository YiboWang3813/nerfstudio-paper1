# @package _global_

defaults:
- /engine: debug_offline
- /scene: liver
- /model: ours
- /loss: default
- /metric: default
- /system: default
- _self_
system:
  exp_tag: ours_probe3d_l1_ssim_scale_wall_1m_10000_dc
scene:
  loading:
    test_mode: holdout_interval
engine:
  state: OursOfflineState
  iterations: 10000
  needed_callbacks:
  - OursOfflineSetupCallback
  - OursOfflineTrainCallback
  - OursOfflineTestCallback
  - OursOfflineSaveCallback
  - OursOfflineFinishCallback
  interval:
    train:
      step: 10
      print: 100
    test: 2500
    save: 5000
model:
  gauss_init:
    num_points: 1000000
  gauss_container:
    init_val:
      opacities: 0.1
      intensities: 0.1
    constraints:
      scale_activation: bounded_sigmoid
      scale_min_mm: 0.05
      scale_max_mm: 3.0
      opacity_max: 0.2
      intensity_max: 1.0
  slice_render:
    mapper_kind: tile
    compositing_mode: additive
    shader_weight_mode: probe3d
    k_sigma: 3.0
    mapper_sort_by_v: false
    fixed_bg_color: 0.0
    elev_corridor_half_mm: 0.228225
    slab_half_thickness_mm: 0.0
  offline:
    density_control:
      enable:
        densify: true
        prune: true
      timing:
        start_iter: 1000
        end_iter: 8000
        freq: 1000
      thresholds:
        densify_grad: 1.0e-05
        split_scale: 0.6
        prune_opacity: 0.01
        prune_intensity: 0.01
loss:
  needed_losses:
  - l1
  - ssim
  - scale_wall
  lambdas:
    l1: 0.5
    ssim: 0.5
    scale_wall: 50.0
metric:
  needed_metrics:
  - psnr
  - l1
  - ssim
  - lpips
experiment:
  family: preproduction/ideas/ours/renderer_baseline
  name: probe3d
  description: Ours probe3d renderer reference template.
