# @package _global_

engine:
  name: default_engine
  state: UltraGSOfflineState
  task: train
  stream: offline
  iterations: 30000
  accum_steps: 1
  resume: ''
  needed_callbacks:
  - UltraGSOfflineSetupCallback
  - UltraGSOfflineTrainCallback
  - UltraGSOfflineTestCallback
  - UltraGSOfflineSaveCallback
  - UltraGSOfflineFinishCallback
  interval:
    train:
      step: 10
      print: 100
    debug: 1000
    test: 2000
    save: 10000
