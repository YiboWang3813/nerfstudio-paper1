model:
  name: ours
  render:
    enable_input_checks: false
  gauss_init:
    num_points: 1000000
  scene_norm:
    margin: 1.15
  slice_render:
    tile_size_px: 8
    num_slices_elevational: 2
    elev_corridor_half_mm: 0.395
    slab_half_thickness_mm: 0.0
    k_sigma: 2.5
    mapper_kind: tile
    num_pixels_lateral: 5
    num_pixels_axial: 5
    mapper_sort_by_v: false
    compositing_mode: additive
    fixed_bg_color: 0.0
    shader_weight_mode: us_focus
    us_focus_sigma_ele_0: 1.0
    us_focus_sigma_ele_1: 0.01
    us_focus_sigma_ele_min: 0.8
    us_focus_sigma_ele_max: 5.0
    us_focus_sigma_lat_0: 0.8
    us_focus_sigma_lat_1: 0.002
    us_focus_sigma_lat_min: 0.4
    us_focus_sigma_lat_max: 3.0
    us_focus_det_gamma: 0.25
    us_focus_det_eps: 1.0e-06
    us_focus_weight_min: 1.0e-06
    us_focus_use_lateral_focus: false
    us_focus_inflate_lat_mm: 0.0
    us_focus_inflate_ax_mm: 0.0
    ray_attenuation_enabled: true
    ray_attenuation_source: attenuation
    ray_attenuation_beta: 0.8
    ray_attenuation_strength: 0.55
    ray_attenuation_min_transmission: 0.35
    ray_attenuation_weight_min: 0.0001
    ray_attenuation_axial_margin_mm: 0.0
    ray_attenuation_quadrature_window_mm: 2.0
    ray_attenuation_quadrature_points: 3
    ray_attenuation_mapper_kind: ray_csr
    ray_attenuation_formula: integral
    ray_attenuation_candidate_k_sigma: 2.0
    render_chunk_size: 256
  gauss_container:
    lr:
      means: 0.00016
      scales: 0.005
      quats: 0.001
      echo_alphas: 0.08
      opacities: 0.08
      intensities: 0.002
      attenuations: 0.01
    init_val:
      echo_alphas: 0.1
      opacities: 0.1
      intensities: 0.1
      attenuations: 0.02
    constraints:
      scale_activation: bounded_sigmoid
      scale_min_mm: 0.05
      scale_max_mm: 3.0
      echo_alpha_max: 0.2
      opacity_max: 0.2
      intensity_max: 1.0
      attenuation_max: 1.0
  offline:
    density_control:
      enable:
        densify: true
        prune: true
      timing:
        start_iter: 1000
        end_iter: 25000
        freq: 2000
      thresholds:
        densify_grad: 1.5e-05
        split_scale: 0.6
        prune_opacity: 0.0001
        prune_intensity: 0.015
        max_scale_mm: 0.0
      strategy: contribution_residual
      responsibility:
        enabled: true
        high_residual_quantile: 0.9
        score_quantile: 0.98
        min_score: 1.0e-06
        max_fraction: 0.05
        mix_mode: responsibility
        union_gradient_fraction: 0.5
        union_gradient_min_factor: 0.25
        structure_weight_enabled: false
        structure_boundary_weight: 0.5
        structure_highpass_weight: 0.5
        structure_speckle_weight: 0.25
        structure_max_weight: 2.5
        low_contribution_quantile: 0.1
        protect_attenuation_enabled: true
        protect_attenuation_quantile: 0.8
  pose_optimization:
    enabled: false
    prior_poses_abspath: ''
    noise_enabled: false
    noise_rot_deg: 0.0
    noise_trans_mm: 0.0
    noise_seed: 20260526
    trainable: false
    start_iter: 0
    end_iter: -1
    lr: 3.0e-05
    lr_rot: null
    lr_trans: null
    optimize_rotation: true
    optimize_translation: true
    lambda_prior: 0.0
    lambda_prior_rot: null
    lambda_prior_trans: null
    lambda_smooth_rot: 0.0
    lambda_smooth_trans: 0.0
    residual_bound_rot_deg: 0.0
    residual_bound_trans_mm: 0.0
    pose_only_start_iter: -1
    pose_only_end_iter: -1
    log_interval: 500
    eval_train_count: 64
  pose_uncertainty:
    enabled: false
    uncertainty_abspath: ''
    weight_mode: direct
    min_weight: 0.1
    max_weight: 1.0
    alpha: 1.0
    image_loss_names:
    - l1
    - ssim
    - mse
    - lpips
    decouple_density_control: true
    log_interval: 500
    mc_enabled: false
    mc_samples: 2
    mc_trans_sigma_mm: 0.0
    mc_rot_sigma_deg: 0.0
