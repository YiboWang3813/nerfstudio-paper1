    confidence_gamma: 1.0
    confidence_min: 0.05
    detach_confidence: true
metric:
  needed_metrics:
  - psnr
  - l1
  - ssim
  - lpips
  - dists
  - gmsd
  psnr_cfg:
    max_val: 1.0
  max_vis_frames: 10
  save_per_frame_metrics: true
model:
  name: ultrags_baseline
  render:
    sh_degree: 2
    active_sh_degree_start: 0
    sh_degree_step_iter: 1000
    camera_mode: slice_plane_physical
    physical_camera_distance_mm: 200.0
    dar_mode: released_disabled
    fov_x_deg: 60.0
    fov_y_deg: 60.0
    fov_x_min_deg: 20.0
    fov_x_max_deg: 140.0
    fov_y_min_deg: 20.0
    fov_y_max_deg: 140.0
    znear: 0.01
    zfar: 1000.0
    bg_color: 0.0
    scale_modifier: 1.0
    enable_slice_cull: true
    slice_thickness_ratio: 1.15
    slice_thickness_mm: null
    slice_cull_std: 3.0
    slice_cull_scale_multiplier: 3.0
    opacity_slice_attenuation: true
    debug: false
    output_grayscale: true
  gauss_container:
    lr:
      means: 0.00016
      sh_dc: 0.0025
      sh_rest: 0.000125
      opacities: 0.01
      scales_2d: 0.0005
      quats: 0.001
      fov_x: 0.001
      fov_y: 0.001
    init_val:
      opacity: 0.005
      scale_2d:
      - 0.25
      - 0.25
      sh_dc: 0.0
      fov_x: 0.0
      fov_y: 0.0
    scheduler:
      position_lr_final_scale: 0.01
      default_lr_final_scale: 0.1
      position_lr_delay_mult: 0.01
    constraints:
      opacity_max: 0.0
  offline:
    density_control:
      enable:
        densify: true
        prune: true
        opacity_reset: false
      timing:
        start_iter: 1000
        end_iter: 25000
        freq: 2000
        densification_interval: 2000
        opacity_reset_interval: 2000
      thresholds:
        densify_grad: 0.0016
        opacity_cull: 0.05
        percent_dense: 0.01
        n_max: null
        min_scale_2d: 0.05
        max_scale_2d: 0.8
    diagnostics:
      enable_render_stats: true
      train_step: 100
