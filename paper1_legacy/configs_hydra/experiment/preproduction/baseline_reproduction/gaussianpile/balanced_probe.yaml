# @package _global_

defaults:
- /engine: debug_offline
- /scene: liver
- /model: gaussianpile
- /loss: default
- /metric: default
- /system: default
- _self_
system:
  exp_tag: gaussianpile_liver_1m_2000_balanced_probe
scene:
  loading:
    test_mode: holdout_interval
engine:
  state: GaussianPileOfflineState
  iterations: 2000
  needed_callbacks:
  - GaussianPileOfflineSetupCallback
  - GaussianPileOfflineTrainCallback
  - GaussianPileOfflineTestCallback
  - GaussianPileOfflineSaveCallback
  - GaussianPileOfflineFinishCallback
  interval:
    train:
      step: 100
      print: 500
    test: 1000
    save: 2000
model:
  gauss_init:
    num_points: 1000000
  slice_render:
    radius_sigma: 1.0
    prefilter_elevational_radius_mm: 4.0
    opacity_cull_threshold: 1.0e-05
  offline:
    density_control:
      enable:
        densify: true
        prune: true
      timing:
        start_iter: 1000
        end_iter: 1500
        freq: 1000
        grad_accum_interval: 1
      thresholds:
        densify_grad: 5.0e-05
        split_scale: 0.6
        min_scale_mm: 0.01
        prune_opacity: 0.02
        max_prune_fraction_per_step: 0.0
        min_keep_ratio: 0.0
      n_max: 2000000
loss:
  needed_losses:
  - l1
  - ssim
  lambdas:
    l1: 1.0
    ssim: 0.2
metric:
  needed_metrics:
  - psnr
  - l1
  - ssim
  - lpips
experiment:
  family: preproduction/baseline_reproduction/gaussianpile
  name: balanced_probe
  description: GaussianPile balanced 2k probe template.
