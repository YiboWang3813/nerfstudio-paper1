# @package _global_

engine:
  name: default_engine
  state: UltraGSOnlineState
  task: train
  stream: online
  iterations: 30000
  accum_steps: 1
  resume: ''
  needed_callbacks:
  - UltraGSOnlineSetupCallback
  - UltraGSOnlineStreamCallback
  - UltraGSOfflineFinishCallback
  stream_eval_skip_head_frames: 0
  stream_eval_skip_tail_frames: 0
  stream_eval_interval_frames: 10
  interval:
    train:
      step: 10
      print: 100
    debug: 1000
    test: 0
    save: 0
