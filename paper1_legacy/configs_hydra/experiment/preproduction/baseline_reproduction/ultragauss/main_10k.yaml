# @package _global_

defaults:
- /engine: debug_offline
- /scene: liver
- /model: ultragauss
- /loss: default
- /metric: default
- /system: default
- _self_
system:
  exp_tag: ultragauss_liver_1m_10000_dc
scene:
  loading:
    test_mode: holdout_interval
  sampler:
    num_init: 1000000
engine:
  state: UltraGaussOfflineState
  iterations: 10000
  needed_callbacks:
  - UltraGaussOfflineSetupCallback
  - UltraGaussOfflineTrainCallback
  - UltraGaussOfflineTestCallback
  - UltraGaussOfflineSaveCallback
  - UltraGaussOfflineFinishCallback
  interval:
    train:
      step: 10
      print: 100
    test: 2500
    save: 5000
model:
  render:
    chi2_threshold: 7.815
    mapper_sort_by_depth: false
    fixed_bg_alpha: 1.0e-06
    fixed_bg_intensity: 0.0
    diag_beta: 0.0001
    jitter_radius_ratio: 0.25
    enable_shadow: false
    shadow_delta: 0.0
  gauss_container:
    lr:
      precision_tril: 0.035
  offline:
    diagnostics:
      enable_render_stats: true
      train_step: 100
    density_control:
      enable:
        densify: true
        prune: true
      timing:
        start_iter: 1000
        end_iter: 8000
        freq: 1000
      thresholds:
        densify_grad: 1.0e-05
        split_scale_mm: 0.6
        prune_opacity: 0.01
        prune_intensity: 0.01
      n_max: 2000000
loss:
  needed_losses:
  - l1
  - ssim
  - scale_wall
  lambdas:
    l1: 0.5
    ssim: 0.5
    scale_wall: 50.0
metric:
  needed_metrics:
  - psnr
  - l1
  - ssim
  - lpips
experiment:
  family: preproduction/baseline_reproduction/ultragauss
  name: main_10k
  description: UltraGauss main 10k template.
