scene:
  dataset_name: synthetic_liver
  loading:
    baseroot: /home/boywang25/ultrasound-scene-reconstruction/data
    dataset_dirname: ''
    sweep_name: l1
    images_name: images.npy
    test_images_name: test_images.npy
    test_poses_name: test_poses.npy
    image_value_mode: uint8_255
    image_nan_value: 0.0
    image_downsample_factor: 1
    axial_downsample_factor: 1
    frame_start: 0
    frame_end: -1
    frame_stride: 1
    frame_indices_path: ''
    test_mode: holdout_interval
    holdout_trim_each: 0
    holdout_num_samples: 16
    holdout_test_ratio: 0.2
    pose_type: relative
    poses_abspath: ''
    pose_mode: file
    canonical_sweep_delta_mm: -1.0
    canonical_sweep_delta_scale: 1.0
    canonical_sweep_ref_frame: 0
    canonical_sweep_axis: z
    canonical_sweep_spacing_mode: uniform
  sampler:
    num_init: 10000
    num_new: 5000
    scales_init:
    - 0.3
    - 0.3
    - 0.3
    quats_init:
    - 1.0
    - 0.0
    - 0.0
    - 0.0
    uniform_ratio: 0.3
    intensity_threshold: 0.05
    jitter_radius: 0.2
  grid:
    tile_size: 4.0
    bbox_margin: 0.05
  scheduler:
    test_ratio: 0.1
engine:
  name: default_engine
  state: UltraGSBaselineOfflineState
  task: train
  stream: offline
  iterations: 3
  accum_steps: 1
  resume: ''
  stream_eval_skip_head_frames: 0
  stream_eval_skip_tail_frames: 0
  stream_eval_interval_frames: 0
  needed_callbacks:
  - UltraGSBaselineOfflineSetupCallback
  - UltraGSBaselineOfflineTrainCallback
  - UltraGSBaselineOfflineTestCallback
  - UltraGSBaselineOfflineSaveCallback
  - UltraGSBaselineOfflineFinishCallback
  interval:
    train:
      step: 10
      print: 100
    debug: 1000
    test: 500
    save: 0
loss:
  needed_losses:
  - l1
  - ssim
  lambdas:
    l1: 0.8
    mse: 0.0
    ssim: 0.2
    sobel: 0.0
    highpass_l1: 0.0
    marco_ssim: 0.0
    lpips: 0.0
    diff_tv: 0.0
    scale_wall: 0.0
    scale_aniso: 0.0
    opacity: 0.0
    attenuation_l1: 0.0
    attenuation_tail: 0.0
    pose_anchor: 0.0
    pose_prior: 0.0
    pose_smooth: 0.0
    pose_acc: 0.0
    pose_aux_rec: 0.0
    pose_registration: 0.0
    pose_neighbor_registration: 0.0
    pose_cycle: 0.0
    pose_const_vel: 0.0
    pose_gt_delta: 0.0
    pose_occ_conf: 0.0
  l1_cfg:
    clamp_inputs: false
  ssim_cfg:
    window_size: 11
    sigma: 1.5
    downsample_enabled: false
    downsample_factor: 1
    downsample_mode: area
    clamp_inputs: false
  highpass_l1_cfg:
    kernel_size: 9
    sigma: 2.0
  marco_ssim_cfg:
    blur_window_size: 21
    blur_sigma: 3.0
    ssim_window_size: 11
    ssim_sigma: 1.5
  lpips_cfg:
    metric_name: lpips
  scale_wall_cfg:
    min_scales_mm: 0.001
    max_scales_mm: 1.2
  scale_aniso_cfg:
    max_aniso_ratio: 2.5
  opacity_cfg:
    target_opacity: 0.5
  attenuation_tail_cfg:
    max_attenuation: 0.05
  pose_anchor_cfg:
    rot_weight: 1.0
    trans_weight: 1.0
  pose_prior_cfg:
    rot_weight: 1.0
    trans_weight: 1.0
  pose_smooth_cfg:
    rot_weight: 1.0
    trans_weight: 1.0
  pose_acc_cfg:
    rot_weight: 1.0
    trans_weight: 1.0
  pose_aux_rec_cfg:
    l1_weight: 0.8
    ssim_weight: 0.2
    window_size: 11
    sigma: 1.5
  pose_registration_cfg:
    photo_weight: 1.0
    grad_weight: 0.2
    charbonnier_eps: 0.001
  pose_neighbor_registration_cfg:
    photo_weight: 1.0
    ssim_weight: 0.2
    charbonnier_eps: 0.001
    window_size: 11
    sigma: 1.5
    min_overlap_ratio: 0.3
  pose_cycle_cfg:
    photo_weight: 1.0
    ssim_weight: 0.1
    charbonnier_eps: 0.001
    window_size: 11
    sigma: 1.5
    min_overlap_ratio: 0.3
  pose_const_vel_cfg:
    rot_weight: 1.0
    trans_weight: 1.0
  pose_gt_delta_cfg:
    rot_weight: 1.0
    trans_weight: 1.0
  pose_occ_conf_cfg:
    charbonnier_epsilon: 0.001
    confidence_gamma: 1.0
    confidence_min: 0.05
    detach_confidence: true
metric:
  needed_metrics:
  - psnr
  - l1
  psnr_cfg:
    max_val: 1.0
  max_vis_frames: 10
  save_per_frame_metrics: true
model:
  name: ultrags_baseline
  render:
    sh_degree: 2
    active_sh_degree_start: 0
    sh_degree_step_iter: 1000
    camera_mode: slice_plane_physical
    physical_camera_distance_mm: 200.0
    dar_mode: released_disabled
    fov_x_deg: 60.0
    fov_y_deg: 60.0
    fov_x_min_deg: 20.0
    fov_x_max_deg: 140.0
    fov_y_min_deg: 20.0
    fov_y_max_deg: 140.0
    znear: 0.01
    zfar: 1000.0
    bg_color: 0.0
    scale_modifier: 1.0
    enable_slice_cull: true
    slice_thickness_mm: 0.3
    slice_cull_std: 3.0
    slice_cull_scale_multiplier: 3.0
    opacity_slice_attenuation: true
    debug: false
    output_grayscale: true
  gauss_container:
    lr:
      means: 0.00016
      sh_dc: 0.0025
      sh_rest: 0.000125
      opacities: 0.05
      scales_2d: 0.005
      quats: 0.001
      fov_x: 0.001
      fov_y: 0.001
    init_val:
      opacity: 0.1
      scale_2d:
      - 0.3
      - 0.3
      sh_dc: 0.0
      fov_x: 0.0
      fov_y: 0.0
    scheduler:
      position_lr_final_scale: 0.01
      default_lr_final_scale: 0.1
      position_lr_delay_mult: 0.01
    constraints:
      opacity_max: 0.0
  offline:
    density_control:
      enable:
        densify: false
        prune: false
        opacity_reset: false
      timing:
        start_iter: 500
        end_iter: 30000
        freq: 0
        densification_interval: 100
        opacity_reset_interval: 3000
      thresholds:
        densify_grad: 0.0002
        opacity_cull: 0.05
        percent_dense: 0.01
        n_max: 300000
        min_scale_2d: 0.0
        max_scale_2d: 0.0
    diagnostics:
      enable_render_stats: true
      train_step: 100
