# @package _global_

defaults:
- /engine: debug_offline
- /scene: liver
- /model: ours
- /loss: default
- /metric: default
- /system: default
- _self_
system:
  exp_tag: ours_us_focus_pose_prior_1m_30000_dc
engine:
  state: OursOfflineState
  iterations: 30000
  needed_callbacks:
  - OursOfflineSetupCallback
  - OursOfflineTrainCallback
  - OursOfflineTestCallback
  - OursOfflineSaveCallback
  - OursOfflineFinishCallback
  interval:
    train:
      step: 10
      print: 100
    test: 5000
    save: 10000
model:
  offline:
    density_control:
      timing:
        start_iter: 1000
        end_iter: 24000
        freq: 1000
  pose_optimization:
    enabled: false
    prior_poses_abspath: ''
    noise_enabled: false
    noise_rot_deg: 0.0
    noise_trans_mm: 0.0
    noise_seed: 20260526
    trainable: false
    start_iter: 0
    end_iter: -1
    lr: 3.0e-05
    lr_rot: null
    lr_trans: null
    optimize_rotation: true
    optimize_translation: true
    lambda_prior: 0.1
    lambda_prior_rot: null
    lambda_prior_trans: null
    lambda_smooth_rot: 0.0
    lambda_smooth_trans: 0.0
    pose_only_start_iter: -1
    pose_only_end_iter: -1
    log_interval: 500
    eval_train_count: 64
  pose_uncertainty:
    enabled: false
    uncertainty_abspath: ''
    weight_mode: direct
    min_weight: 0.1
    max_weight: 1.0
    alpha: 1.0
    image_loss_names:
    - l1
    - ssim
    - mse
    - lpips
    decouple_density_control: true
    log_interval: 500
  gauss_init:
    num_points: 1000000
  gauss_container:
    lr:
      opacities: 0.08
      intensities: 0.002
    init_val:
      opacities: 0.1
      intensities: 0.1
    constraints:
      scale_activation: bounded_sigmoid
      scale_min_mm: 0.05
      scale_max_mm: 3.0
      opacity_max: 0.2
      intensity_max: 1.0
  slice_render:
    mapper_kind: tile
    tile_size_px: 8
    compositing_mode: additive
    shader_weight_mode: us_focus
    k_sigma: 2.5
    mapper_sort_by_v: false
    fixed_bg_color: 0.0
    elev_corridor_half_mm: 0.228225
    slab_half_thickness_mm: 0.0
    us_focus_sigma_ele_0: 1.0
    us_focus_sigma_ele_1: 0.01
    us_focus_sigma_ele_min: 0.8
    us_focus_sigma_ele_max: 5.0
    us_focus_sigma_lat_0: 0.8
    us_focus_sigma_lat_1: 0.002
    us_focus_sigma_lat_min: 0.4
    us_focus_sigma_lat_max: 3.0
    us_focus_det_gamma: 0.25
    us_focus_det_eps: 1.0e-06
    us_focus_weight_min: 1.0e-06
    us_focus_use_lateral_focus: false
scene:
  loading:
    test_mode: holdout_interval
loss:
  needed_losses:
  - l1
  - ssim
  - scale_wall
  lambdas:
    l1: 0.65
    ssim: 0.35
    scale_wall: 50.0
metric:
  needed_metrics:
  - psnr
  - l1
  - ssim
  - lpips
experiment:
  family: preproduction/ideas/ours/pose_uncertainty_prior
  name: pose_prior
  description: US focus 30k pose-prior production template.
